<!doctype html>
<meta charset="utf-8">
<!-- The <title> text below is a deliberate FIFTH difference from drifted.html
     (a self-identifying label for whichever file loaded) — not an undocumented
     drift. It sits outside the `.hero` root that measure() walks, so it can
     never reach an element diff or the four documented deltas. -->
<title>fidelity reference</title>
<style>
  * { margin: 0; box-sizing: border-box; }
  body { font-family: Arial, sans-serif; }
  .hero { padding: 96px 24px; background: rgb(11, 11, 15); display: flex;
          flex-direction: column; gap: 24px; align-items: flex-start; width: 1000px; }
  /* align-self: stretch pins the title's box.w to the flex container's
     cross-axis width regardless of font-size, so the font-size drift below
     cannot also move box.w — an undocumented geometric consequence that is
     not one of the four documented drifts and must not leak into the diff. */
  .hero__title { font-size: 56px; line-height: 64px; font-weight: 700;
                 letter-spacing: -1.12px; color: rgb(255, 255, 255); align-self: stretch; }
  .hero__cta { font-size: 16px; line-height: 24px; font-weight: 600;
               padding: 16px 32px; border-radius: 28px;
               background: rgb(232, 255, 90); color: rgb(11, 11, 15); border: 0; }
</style>
<section class="hero" data-fid="hero.0">
  <h1 class="hero__title" data-fid="hero.title.0">Build faster</h1>
  <button class="hero__cta" data-fid="hero.cta.0">Start building</button>
</section>
